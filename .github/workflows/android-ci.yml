name: Android CI

# Builds the debug APK and runs the unit tests on every pushed commit
# (any branch) and on every pull request.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A newer commit on the same branch/PR cancels the run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # gradle/gradle-daemon-jvm.properties asks for a Java 25 daemon.
      - name: Set up JDK 25 (Gradle daemon toolchain)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle (wrapper validation + cache)
        uses: gradle/actions/setup-gradle@v4

      # With an empty cache (e.g. PR runs, read-only cache) the first resolution
      # of the settings/build plugins (foojay, AGP, Kotlin, google-services) can
      # fail on a transient network error from the Gradle Plugin Portal. Warm it
      # up with retries so a network flake doesn't fail the whole run.
      - name: Resolve Gradle plugins (with retries)
        run: |
          for attempt in 1 2 3; do
            if ./gradlew help --no-configuration-cache; then
              exit 0
            fi
            echo "::warning::Gradle plugin resolution failed (attempt $attempt/3), retrying in $((attempt * 20)) s"
            sleep $((attempt * 20))
          done
          exit 1

      - name: Build debug APK and run unit tests
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --stacktrace

      - name: Upload unit test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
